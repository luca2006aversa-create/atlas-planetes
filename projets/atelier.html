<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kibsu · atelier</title>
<link href="../tokens.css" rel="stylesheet">
<style>
  body { margin: 0; background: var(--fond); color: var(--texte); font: var(--t-corps)/1.45 var(--sans); }
  .haut { display: flex; gap: 14px; align-items: baseline; flex-wrap: wrap; padding: 12px 16px 0; }
  .haut h1 { font-size: 20px; margin: 0; }
  .haut nav { font-size: 13px; } .haut nav a { color: var(--texte-2); margin-right: 10px; }
  .grille { display: grid; grid-template-columns: 170px minmax(0, 1fr) 300px; gap: 12px; padding: 12px 16px 24px; height: calc(100vh - 148px); box-sizing: border-box; }
  .liste { display: flex; flex-direction: column; gap: 5px; overflow-y: auto; }
  .liste .dom { font: 600 11.5px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--texte-2); margin: 8px 0 2px; }
  .liste button { text-align: left; font: 13px var(--sans); background: var(--surface); color: var(--texte); border: 1px solid var(--filet); border-radius: 8px; padding: 6px 9px; cursor: pointer; }
  .liste button.on { border: 2px solid var(--vif, #e4572e); padding: 5px 8px; }
  .liste button small { color: var(--texte-2); display: block; }
  .scene { position: relative; background: var(--surface); border: 1px solid var(--filet); border-radius: 10px; overflow: hidden; min-height: 320px; }
  #vue { position: absolute; inset: 0; }
  #parcours { position: absolute; inset: 44px 8px 30px; overflow: auto; }
  #parcours svg { display: block; margin: 0 auto; }
  .panneau { overflow-x: hidden; } .panneau select { max-width: 100%; }
  #parcours .nd { cursor: pointer; }
  #parcours .nd:hover rect, #parcours .nd:hover polygon { stroke-width: 2.5; }
  #parcours text { font: 12px var(--sans); fill: var(--texte); }
  #parcours text.t { font-weight: 600; }
  #parcours text.p { fill: var(--texte-2); font-size: 11px; }
  .msg { font-size: 12.5px; margin: 2px 0; } .msg b { font-family: var(--mono); }
  .chemin { font: 12px var(--mono); color: var(--texte-2); }
  .modes { position: absolute; left: 10px; top: 10px; display: flex; gap: 6px; }
  .modes button { font: 600 12.5px var(--sans); background: var(--surface-2); color: var(--texte); border: 1px solid var(--filet); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
  .modes button.on { background: var(--texte); color: var(--fond); }
  .aide { position: absolute; left: 10px; bottom: 8px; font-size: 12px; color: var(--texte-2); }
  .etq { position: absolute; transform: translate(-50%, -120%); font: 600 12px var(--sans); white-space: nowrap; pointer-events: none;
         background: var(--surface); border: 1px solid var(--filet); border-radius: 5px; padding: 1px 5px; }
  .etq.libre { border-color: #e4572e; color: #b23c17; }
  .etq.niveau { border-color: #d9822b; color: #8a4a0c; transform: translate(0, -50%); }
  .niv { display: grid; grid-template-columns: 34px 58px 1fr 22px; gap: 4px 6px; align-items: center; font-size: 13px; padding: 5px 0; border-top: 1px solid var(--filet); }
  .niv input { width: 100%; box-sizing: border-box; font: 13px var(--mono); padding: 2px 4px; border: 1px solid var(--filet); border-radius: 5px; background: var(--fond); color: var(--texte); }
  .niv input.fn { font-family: var(--sans); }
  .niv .chiffres { grid-column: 2 / 5; font: 12px var(--mono); color: var(--texte-2); }
  .niv button, .ajout { font: 12px var(--sans); background: none; border: 1px solid var(--filet); border-radius: 5px; color: var(--texte); cursor: pointer; padding: 2px 6px; }
  select { font: 13px var(--sans); padding: 3px 5px; border: 1px solid var(--filet); border-radius: 5px; background: var(--fond); color: var(--texte); }
  .panneau { overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
  .carte { background: var(--surface); border: 1px solid var(--filet); border-radius: 10px; padding: 10px 12px; }
  .carte h2 { font: 600 11.5px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--texte-2); margin: 0 0 6px; }
  .ligne { display: flex; justify-content: space-between; gap: 8px; align-items: center; font-size: 13px; margin: 3px 0; }
  .ligne input { width: 70px; font: 13px var(--mono); padding: 3px 5px; border: 1px solid var(--filet); border-radius: 5px; background: var(--fond); color: var(--texte); }
  .gros { font: 600 18px var(--mono); }
  .ok { color: #2f8a3c; } .non { color: #c23b12; } .inc { color: #b07a10; }
  .st { font: 12px var(--mono); color: var(--texte-2); }
  .port { display: grid; grid-template-columns: 22px 1fr auto; gap: 2px 8px; align-items: center; font-size: 13px; padding: 5px 0; border-top: 1px solid var(--filet); }
  .port b { font: 600 13px var(--mono); }
  .port .pt { width: 12px; height: 12px; border-radius: 50%; background: #9a9a9a; }
  .port .pt.libre { background: #e4572e; }
  .port button { font: 12px var(--sans); background: none; border: 1px solid var(--filet); border-radius: 5px; color: var(--texte); cursor: pointer; padding: 2px 6px; }
  .note { font-size: 12px; color: var(--texte-2); }
  .actions button, .actions a { font: 600 12.5px var(--sans); background: var(--surface-2); color: var(--texte); border: 1px solid var(--filet); border-radius: 6px; padding: 6px 10px; cursor: pointer; text-decoration: none; display: inline-block; margin: 2px 4px 2px 0; }
  @media (max-width: 860px) { .grille { grid-template-columns: 1fr; height: auto; } .scene { height: 360px; } .liste { flex-direction: row; flex-wrap: wrap; } .liste .dom { width: 100%; } }
</style>
<script src="../nav.js" defer></script>

<body>
<div class="haut">
  <h1>Atelier</h1>
  <select id="fiches" aria-label="Fiche projet"></select>
  <span class="note" id="nomfiche"></span>
</div>
<div class="grille">
  <div class="liste" id="liste"></div>
  <div class="scene">
    <div id="vue"></div>
    <div id="etiquettes"></div>
    <div id="parcours" hidden></div>
    <div class="modes"><button id="m-seul" class="on">Seul</button><button id="m-tout">Assemblage</button><button id="m-parcours">Parcours</button></div>
    <div class="aide" id="aide">Glisser pour tourner · molette pour zoomer · cliquer un élément pour l'ouvrir</div>
  </div>
  <div class="panneau" id="panneau"></div>
</div>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { val, stat, volumeForme } from './controle.js';
import { assembler, versMonde } from './assemblage.js';
import { CATALOGUE, HYP, enveloppe, niveaux, changerType, plancherParDefaut } from './formes.js';
import { geometrie, bilan, directions, dosePoint, pointEspace } from './rayons.js';
import { controler } from './controle.js';
import { ficheAssemblee } from './assemblage.js';
import { analyser, porteDe, zoneDe, transitionDe } from './connexions.js';

const Q = new URLSearchParams(location.search);
const ficheNom = Q.get('fiche') || 'pole-sud-esquisse.json';
const [F, R, CX] = await Promise.all([ficheNom, 'regles.json', 'connexions.json'].map(u => fetch(u).then(r => r.json())));
document.getElementById('nomfiche').textContent = F.nom;
const FICHES = [['pole-sud-esquisse.json', 'Esquisse'], ['pole-sud-fenetre-protegee.json', 'Fenêtre protégée'], ['pole-sud-zones.json', 'Zones'], ['pole-sud-connexions.json', 'Connexions (exemple)']];
{ const s = document.getElementById('fiches');
  s.innerHTML = FICHES.map(([f, n]) => `<option value="${f}" ${f === ficheNom ? 'selected' : ''}>${n}</option>`).join('') + (FICHES.some(x => x[0] === ficheNom) ? '' : `<option selected>${ficheNom}</option>`);
  s.onchange = () => { location.search = '?fiche=' + encodeURIComponent(s.value); }; }
{ const lc = document.getElementById("lien-controle"); if (lc) lc.href = `controle.html?fiche=${encodeURIComponent(ficheNom)}`; }
const E = Object.fromEntries(F.elements.map(e => [e.id, e]));
let sel = E[Q.get('el')] ? Q.get('el') : (F.assemblage?.ancre || F.elements[0].id);
let mode = 'seul';
let A = assembler(F, CX);
let X = analyser(F, CX, A);
// horizon du relief (étude) pour le calcul des doses ; sans lui, tout le ciel au-dessus de 0° est ouvert
const HORIZON = await fetch('../etude/donnees/habitat.json').then(r => r.json()).then(j => j.horizon?.h || null).catch(() => null);
const DIRS = directions(600);

// Dose de chaque espace du programme (µSv/h) + budget RAD-3, recalculés à chaque changement de la fiche
function doses() {
  const Fa = ficheAssemblee(F), pts = R.hypotheses.dose_gcr.pts, abri = val(R.hypotheses.abri_eruption_g_cm2);
  const G = geometrie(Fa, val(R.hypotheses.masse_volumique_regolithe));
  const mesure = P => { const b = bilan(G, P, DIRS, HORIZON), d = dosePoint(b.vals, pts); return { mSv_h: d.mSv_j / 24, min: d.min, abri: d.min != null && d.min >= abri }; };
  const zones = (F.programme.fonctions || []).map(fn => {
    const P = pointEspace(Fa, fn); if (!P) return { id: fn.id };
    const m = mesure(P); return { id: fn.id, mSv_h: m.mSv_h, mSv_j: m.mSv_h * 24, min_g_cm2: m.min, abri_eruption: m.abri };
  });
  const budget = controler(Fa, R, { rayons: { zones } }).find(x => x.id === 'RAD-3');
  return { Fa, zones, budget, mesure };
}

// ---------- scène ----------
const boite = document.getElementById('vue');
const rendu = new THREE.WebGLRenderer({ antialias: true });
rendu.setPixelRatio(Math.min(2, devicePixelRatio));
boite.appendChild(rendu.domElement);
const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(45, 1, 0.1, 2000);
const ctl = new OrbitControls(cam, rendu.domElement);
ctl.enableDamping = true;
scene.add(new THREE.HemisphereLight(0xffffff, 0x777777, 1.6));
const soleil = new THREE.DirectionalLight(0xffffff, 1.4); soleil.position.set(30, 50, 20); scene.add(soleil);
const css = getComputedStyle(document.documentElement);
const fondCouleur = () => new THREE.Color(css.getPropertyValue('--surface').trim() || '#ffffff');
let racine = new THREE.Group(); scene.add(racine);
const etqs = document.getElementById('etiquettes');
let etiquettes = [];

const T = (x, y, z) => new THREE.Vector3(x, z, -y);                 // repère du projet → three
const MAT = {
  sel: new THREE.MeshStandardMaterial({ color: 0xd8d3c8, roughness: .8, side: THREE.DoubleSide }),
  autre: new THREE.MeshStandardMaterial({ color: 0x9a9a9a, roughness: .9, transparent: true, opacity: .35, side: THREE.DoubleSide }),
  dedans: new THREE.MeshStandardMaterial({ color: 0x5fae6e, roughness: .8, side: THREE.DoubleSide }),
  ouv: new THREE.MeshStandardMaterial({ color: 0x5f8fd0, roughness: .8, transparent: true, opacity: .6, side: THREE.DoubleSide }),
  libre: new THREE.MeshStandardMaterial({ color: 0xe4572e }),
  porteOk: new THREE.MeshStandardMaterial({ color: 0x4f8a5b }),
  porteNon: new THREE.MeshStandardMaterial({ color: 0xd6421b, emissive: 0x5a1000 }),
  relie: new THREE.MeshStandardMaterial({ color: 0x6b6b6b }),
  tunnel: new THREE.MeshStandardMaterial({ color: 0xb8b2a6, roughness: .9 }),
  verre: new THREE.MeshStandardMaterial({ color: 0xd8d3c8, roughness: .8, transparent: true, opacity: .28, side: THREE.DoubleSide, depthWrite: false }),
  plancher: new THREE.MeshStandardMaterial({ color: 0xd9822b, roughness: .9, transparent: true, opacity: .85, side: THREE.DoubleSide }),
  bas: new THREE.MeshStandardMaterial({ color: 0xc23b12, roughness: .9, transparent: true, opacity: .55, side: THREE.DoubleSide }),
};

// Maillage d'une forme dans son repère (origine = centre au sol)
function maillage(f, mat) {
  if (!f) return null;
  const d = val(f.diametre_m), L = val(f.longueur_m), h = val(f.hauteur_m);
  let g, y = 0, rz = 0;
  switch (f.type) {
    case 'cylindre':
      if (f.axe === 'vertical') { g = new THREE.CylinderGeometry(d / 2, d / 2, L, 48); y = L / 2; }
      else { g = new THREE.CylinderGeometry(d / 2, d / 2, L, 48); y = d / 2; rz = Math.PI / 2; }
      break;
    case 'noeud': g = new THREE.CylinderGeometry(d / 2, d / 2, h, 48); y = h / 2; break;
    case 'capsule': g = new THREE.CapsuleGeometry(d / 2, Math.max(0, h - d), 12, 48); y = h / 2; break;
    case 'voute': {
      const l = val(f.largeur_m), s = new THREE.Shape(), n = 24;
      s.moveTo(-l / 2, 0);
      for (let i = 0; i <= 2 * n; i++) { const u = -1 + i / n; s.lineTo(u * l / 2, h * (1 - u * u)); }
      s.lineTo(l / 2, 0); s.lineTo(-l / 2, 0);
      g = new THREE.ExtrudeGeometry(s, { depth: L, bevelEnabled: false }); g.translate(0, 0, -L / 2); g.rotateY(Math.PI / 2);
      break;
    }
    case 'tore': g = new THREE.TorusGeometry(val(f.diametre_anneau_m) / 2, d / 2, 24, 96); g.rotateX(Math.PI / 2); y = d / 2; break;
    case 'dome': g = new THREE.SphereGeometry(d / 2, 40, 20, 0, Math.PI * 2, 0, Math.PI / 2); break;
    case 'sphere': g = new THREE.SphereGeometry(d / 2, 40, 20); y = d / 2; break;
    case 'boite': { const env = enveloppe(f); g = new THREE.BoxGeometry(env.x * 2, env.h, env.y * 2); y = env.h / 2; break; }
    case 'chapeau': g = new THREE.ConeGeometry(val(f.rayon_m), h, 40); y = h / 2; break;
    default: return null;
  }
  const m = new THREE.Mesh(g, mat); m.position.y = y; m.rotation.z = rz;
  return m;
}

function etiquette(texte, pos3, cls = '') {
  const div = document.createElement('div'); div.className = 'etq ' + cls; div.textContent = texte;
  etqs.appendChild(div); etiquettes.push({ div, pos: pos3 });
}

// Une porte dessinée à sa vraie taille (ronde, carrée, rectangulaire), sur la face de l'élément ; couleur = état des contrôles
function flechePort(q, libre, pose, id) {
  const g = new THREE.Group();
  const p = pose ? versMonde(pose, q.p) : q.p;
  const nn = pose ? q.nW : q.n;
  const qf = id && E[id]?.ports?.find(x => x.id === q.id);
  const P = qf ? porteDe(qf, CX) : { forme: 'rond', largeur: q.diametre || 1, hauteur: q.diametre || 1 };
  const etat = X.portes.find(x => x.element === id && x.port === q.id)?.msgs || [];
  const mat = etat.some(m => m.etat === 'non') ? MAT.porteNon : libre ? MAT.libre : MAT.porteOk;
  const dir = T(...nn).normalize();
  let porte;
  if (P.forme === 'rond' || Math.abs(nn[2]) > 0.9) {
    const r = Math.max(0.2, P.largeur / 2);
    porte = new THREE.Mesh(new THREE.CylinderGeometry(r, r, 0.1, 40), mat);
    porte.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
  } else {
    const sh = new THREE.Shape(), w = P.largeur / 2, h = P.hauteur / 2, k = P.forme === 'rect' ? 0.02 : Math.min(w, h) * 0.35;
    sh.moveTo(-w + k, -h); sh.lineTo(w - k, -h); sh.quadraticCurveTo(w, -h, w, -h + k); sh.lineTo(w, h - k); sh.quadraticCurveTo(w, h, w - k, h);
    sh.lineTo(-w + k, h); sh.quadraticCurveTo(-w, h, -w, h - k); sh.lineTo(-w, -h + k); sh.quadraticCurveTo(-w, -h, -w + k, -h);
    porte = new THREE.Mesh(new THREE.ExtrudeGeometry(sh, { depth: 0.1, bevelEnabled: false }), mat);
    porte.rotation.y = Math.atan2(dir.x, dir.z);
  }
  porte.position.copy(T(...p));
  g.add(porte);
  g.add(new THREE.ArrowHelper(dir, T(...p), 1.4, libre ? 0xe4572e : 0x6b6b6b, 0.4, 0.28));
  return g;
}

// Vue Parcours : de l'extérieur vers chaque espace, colonnes = nombre de portes franchies
function dessinerParcours() {
  const box = document.getElementById('parcours');
  const prof = { dehors: 0 };
  for (const [id, ch] of Object.entries(X.parcours)) prof[id] = ch.length - 1;
  const ids = F.elements.filter(e => e.pressurise || transitionDe(e, CX)).map(e => e.id);
  const inj = ids.filter(id => !(id in prof));
  const maxP = Math.max(1, ...Object.values(prof));
  const cols = {};
  for (const id of ['dehors', ...ids.filter(i => i in prof)]) (cols[prof[id]] ||= []).push(id);
  if (inj.length) cols[maxP + 1] = inj;
  // vertical : une rangée par nombre de portes franchies, dehors en haut
  const nRang = Object.keys(cols).length, larg = Math.max(...Object.values(cols).map(c => c.length));
  const W = Math.max(420, 100 + larg * 140), Hh = nRang * 80 + 20;
  const pos = {};
  Object.entries(cols).forEach(([c, liste], ri) => { const x0 = 90 + (W - 90 - liste.length * 140) / 2; liste.forEach((id, i) => { pos[id] = [x0 + i * 140 + 10, 14 + ri * 80]; }); });
  // arêtes : liaisons (et portes extérieures libres)
  const pire = msgs => msgs.some(m => m.etat === 'non') ? 'non' : msgs.some(m => m.etat === 'doute') ? 'doute' : 'ok';
  const couleurEtat = { ok: '#8a8f96', doute: '#c99a2e', non: '#d6421b' };
  const elt = s => String(s).split('.')[0];
  const ar = [];
  for (const l of X.liens) {
    const a = elt(l.de), b = elt(l.vers), et = pire(l.msgs);
    if (l.pressurisee) ar.push([a, b, et, l.type]); else { ar.push([a, 'dehors', et, l.type]); ar.push([b, 'dehors', et, l.type]); }
  }
  for (const p of X.portes) if (!p.relie && p.versDehors) ar.push([p.element, 'dehors', pire(p.msgs), 'porte']);
  const L = ar.filter(([a, b]) => pos[a] && pos[b]).map(([a, b, et]) => {
    const [x1, y1] = pos[a], [x2, y2] = pos[b];
    return `<line x1="${x1 + 60}" y1="${y1 + 22}" x2="${x2 + 60}" y2="${y2 + 22}" stroke="${couleurEtat[et]}" stroke-width="${et === 'ok' ? 2 : 3}" ${et === 'non' ? 'stroke-dasharray="6 4"' : ''}/>`;
  }).join('');
  const N = Object.entries(pos).map(([id, [x, y]]) => {
    const e = E[id], tr = id === 'dehors' ? null : transitionDe(e, CX);
    const z = id === 'dehors' ? 'exterieur' : zoneDe(e, CX);
    const coul = tr ? '#ffffff' : CX.zones[z]?.couleur || '#999';
    const nErr = id === 'dehors' ? 0 : [...(X.elements[id]?.msgs || []), ...X.portes.filter(p => p.element === id).flatMap(p => p.msgs)].filter(m => m.etat === 'non').length;
    const titre = id === 'dehors' ? 'Dehors' : id;
    const sous = id === 'dehors' ? 'vide, poussière' : tr ? (CX.transitions[tr]?.nom || tr) : (CX.zones[z]?.nom || z || e.type);
    const forme = tr
      ? `<polygon points="${x + 10},${y} ${x + 110},${y} ${x + 120},${y + 22} ${x + 110},${y + 44} ${x + 10},${y + 44} ${x},${y + 22}" fill="var(--surface)" stroke="#1f1f1f" stroke-dasharray="4 3" stroke-width="1.5"/>`
      : `<rect x="${x}" y="${y}" width="120" height="44" rx="8" fill="var(--surface)"/><rect x="${x}" y="${y}" width="120" height="44" rx="8" fill="${coul}" fill-opacity="${id === sel ? .55 : .25}" stroke="${coul}" stroke-width="${id === sel ? 3 : 1.5}"/>`;
    return `<g class="nd" data-id="${id}">${forme}<text class="t" x="${x + 60}" y="${y + 19}" text-anchor="middle">${titre}${nErr ? ` ✗${nErr}` : ''}</text><text class="p" x="${x + 60}" y="${y + 34}" text-anchor="middle">${sous}</text></g>`;
  }).join('');
  const ent = Object.keys(cols).map((c, ri) => `<text class="p" x="6" y="${14 + ri * 80 + 26}">${+c === maxP + 1 && inj.length ? 'injoignable' : c == 0 ? '' : c + (c == 1 ? ' porte' : ' portes')}</text>`).join('');
  box.innerHTML = `<svg viewBox="0 0 ${W} ${Hh}" width="100%" style="max-width:${W * 1.3}px" role="img" aria-label="Parcours depuis l'extérieur">${ent}${L}${N}</svg>
    <div class="note" style="padding:4px 2px">Rangées : nombre de portes franchies depuis dehors (par le sas principal). Hexagone pointillé = pièce de transition. Trait gris = liaison correcte, orange = à voir, rouge pointillé = règle non respectée.</div>`;
  box.querySelectorAll('.nd').forEach(n => n.onclick = () => { if (n.dataset.id !== 'dehors') choisir(n.dataset.id); });
}

// Élément « dans » un autre : sa forme est écrite dans le repère du site (centre_m) ; on la ramène dans celui du parent
function versLocal(pose, w) {
  const c = Math.cos(-pose.rot * Math.PI / 180), s = Math.sin(-pose.rot * Math.PI / 180);
  const dx = w[0] - pose.pos[0], dy = w[1] - pose.pos[1];
  return [c * dx - s * dy, s * dx + c * dy, (w[2] ?? 0) - pose.pos[2]];
}

const cliquables = [];
function construire() {
  const P = document.getElementById('parcours'), V = document.getElementById('vue');
  P.hidden = mode !== 'parcours'; V.style.visibility = mode === 'parcours' ? 'hidden' : '';
  document.getElementById('aide').hidden = mode === 'parcours';
  if (mode === 'parcours') { etqs.innerHTML = ''; etiquettes = []; dessinerParcours(); return; }
  scene.remove(racine); racine = new THREE.Group(); scene.add(racine);
  etqs.innerHTML = ''; etiquettes = []; cliquables.length = 0;
  scene.background = fondCouleur();
  const grille = new THREE.GridHelper(mode === 'seul' ? 30 : 120, mode === 'seul' ? 30 : 60, 0x9a9a9a, 0xd0d0d0);
  grille.material.transparent = true; grille.material.opacity = .5; racine.add(grille);
  const e = E[sel];
  if (mode === 'seul') {
    const NV = niveaux(e);
    const m = maillage(e.forme, NV.length ? MAT.verre : MAT.sel);
    if (m) { racine.add(m); m.userData.id = e.id; cliquables.push(m); }
    // Planchers : la coupe de la forme à la hauteur de chaque niveau
    for (const n of NV) {
      const c = n.coupe; if (!c || c.aire <= 0) continue;
      let g;
      if (c.forme === 'rect') g = new THREE.BoxGeometry(2 * c.a, 0.1, 2 * c.b);
      else if (c.forme === 'disque') g = new THREE.CylinderGeometry(c.a, c.a, 0.1, 64);
      else { g = new THREE.RingGeometry(c.a, c.b, 96); g.rotateX(-Math.PI / 2); }
      const s = new THREE.Mesh(g, n.hauteur_libre >= val(HYP.hauteur_debout_m) ? MAT.plancher : MAT.bas);
      s.position.y = n.z; racine.add(s);
      etiquette(`${n.id}${n.fonction ? ' · ' + n.fonction : ''} · ${fmt(n.aire, 0)} m²`, T(c.forme === 'anneau' ? c.b : 0, -(c.forme === 'rect' ? c.b : c.forme === 'anneau' ? c.b : c.a), n.z + 0.3), 'niveau');
    }
    for (const q of A.ports[e.id] || []) {
      racine.add(flechePort(q, !q.relie_a, null, e.id));
      etiquette(`${q.id}${q.relie_a ? ' → ' + q.relie_a : ' libre'}`, T(q.p[0] + q.n[0] * 1.9, q.p[1] + q.n[1] * 1.9, q.p[2] + q.n[2] * 1.9 + 0.4), q.relie_a ? '' : 'libre');
    }
    const pose = A.poses[e.id];
    for (const d of F.elements.filter(x => x.dans === e.id)) {
      const centre = d.forme?.centre_m;
      const mm = maillage(d.forme, d.type === 'ouverture' ? MAT.ouv : MAT.dedans);
      if (mm && centre && pose) {
        const l = versLocal(pose, centre);
        const env = enveloppe(d.forme);
        const grp = new THREE.Group(); grp.add(mm); grp.position.copy(T(l[0], l[1], l[2] - env.h / 2)); racine.add(grp);
        etiquette(d.id, T(l[0], l[1], l[2] + env.h / 2 + .3));
      }
    }
    const env = enveloppe(e.forme) || { x: 3, y: 3, h: 3 };
    const t = Math.max(env.x, env.y, env.h);
    cam.position.set(t * 2.2, t * 1.6, t * 2.8); ctl.target.set(0, env.h / 2, 0);
  } else {
    let xs = [];
    for (const x of F.elements) {
      const pose = A.poses[x.id];
      if (!pose) continue;
      const m = maillage(x.forme, x.id === sel ? MAT.sel : MAT.autre);
      if (!m) continue;
      const g = new THREE.Group(); g.add(m);
      g.position.copy(T(...pose.pos)); g.rotation.y = pose.rot * Math.PI / 180;
      m.userData.id = x.id; cliquables.push(m); racine.add(g);
      const env = enveloppe(x.forme);
      etiquette(x.id, T(pose.pos[0], pose.pos[1], pose.pos[2] + env.h + .6));
      xs.push(pose.pos[0]);
      for (const q of A.ports[x.id] || []) racine.add(flechePort(q, !q.relie_a, pose, x.id));
    }
    // Tunnels et couloirs : un tube entre les deux ports reliés
    for (const l of A.liens.filter(l => l.port_de && l.ecart > 0)) {
      const a = A.ports[l.de].find(q => q.id === l.port_de), b = A.ports[l.vers].find(q => q.id === l.port_vers);
      if (!a.pW || !b.pW) continue;
      const pa = T(...a.pW), pb = T(...b.pW), r = Math.max(.3, (a.diametre || 1) / 2 + .2);
      const tube = new THREE.Mesh(new THREE.CylinderGeometry(r, r, pa.distanceTo(pb), 24), MAT.tunnel);
      tube.position.copy(pa.clone().add(pb).multiplyScalar(.5));
      tube.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), pb.clone().sub(pa).normalize());
      racine.add(tube);
    }
    const cx = xs.length ? (Math.min(...xs) + Math.max(...xs)) / 2 : 0, w = xs.length ? Math.max(...xs) - Math.min(...xs) + 16 : 30;
    const hfov = 2 * Math.atan(Math.tan(cam.fov * Math.PI / 360) * cam.aspect);
    const recul = Math.max(w / 2 / Math.tan(Math.min(hfov, cam.fov * Math.PI / 180) / 2) * 1.05, 20);
    const dir = new THREE.Vector3(.2, .5, .95).normalize();
    ctl.target.set(cx, 2, 0); cam.position.copy(ctl.target).addScaledVector(dir, recul);
  }
  ctl.update();
}

function taille() {
  const r = boite.getBoundingClientRect();
  rendu.setSize(r.width, r.height, false);
  rendu.domElement.style.width = '100%'; rendu.domElement.style.height = '100%';
  cam.aspect = r.width / Math.max(1, r.height); cam.updateProjectionMatrix();
}
new ResizeObserver(taille).observe(boite);

const ray = new THREE.Raycaster(), souris = new THREE.Vector2();
let bas = null;
rendu.domElement.addEventListener('pointerdown', ev => { bas = [ev.clientX, ev.clientY]; });
rendu.domElement.addEventListener('pointerup', ev => {
  if (!bas || Math.hypot(ev.clientX - bas[0], ev.clientY - bas[1]) > 4) return;
  const r = rendu.domElement.getBoundingClientRect();
  souris.set((ev.clientX - r.left) / r.width * 2 - 1, -(ev.clientY - r.top) / r.height * 2 + 1);
  ray.setFromCamera(souris, cam);
  const h = ray.intersectObjects(cliquables)[0];
  if (h && h.object.userData.id !== sel) choisir(h.object.userData.id);
});

function boucle() {
  requestAnimationFrame(boucle);
  ctl.update(); rendu.render(scene, cam);
  const r = rendu.domElement.getBoundingClientRect();
  for (const { div, pos } of etiquettes) {
    const p = pos.clone().project(cam);
    const vis = p.z < 1 && Math.abs(p.x) < 1.1 && Math.abs(p.y) < 1.1;
    div.style.display = vis ? '' : 'none';
    div.style.left = `${(p.x + 1) / 2 * r.width}px`; div.style.top = `${(1 - p.y) / 2 * r.height}px`;
  }
}

// ---------- liste ----------
const GROUPES = [['module', 'Modules'], ['sas', 'Sas'], ['serre', 'Serres'], ['ouverture', 'Ouvertures'], ['protection', 'Protection']];
function liste() {
  const L = document.getElementById('liste'); L.innerHTML = '';
  const vus = new Set();
  const ajoute = (titre, els) => {
    if (!els.length) return;
    const t = document.createElement('div'); t.className = 'dom'; t.textContent = titre; L.appendChild(t);
    for (const e of els) {
      vus.add(e.id);
      const qs = A.ports[e.id] || [], libres = qs.filter(q => !q.relie_a).length;
      const b = document.createElement('button'); if (e.id === sel) b.className = 'on';
      b.innerHTML = `${e.id} · ${e.nom || e.type}<small>${qs.length ? `${qs.length} port${qs.length > 1 ? 's' : ''}${libres ? ` · ${libres} libre${libres > 1 ? 's' : ''}` : ''}` : (e.dans ? 'dans ' + e.dans : '')}</small>`;
      b.onclick = () => choisir(e.id);
      L.appendChild(b);
    }
  };
  for (const [t, nom] of GROUPES) ajoute(nom, F.elements.filter(e => e.type === t));
  ajoute('Autres', F.elements.filter(e => !vus.has(e.id)));
}

// ---------- panneau ----------
const fmt = (x, n = 1) => { x = val(x); return x == null || Number.isNaN(+x) ? '?' : ((+(+x).toFixed(n)) || 0).toLocaleString('fr-FR'); };
const CHAMPS = [['diametre_m', 'Diamètre (m)'], ['longueur_m', 'Longueur (m)'], ['largeur_m', 'Largeur (m)'], ['hauteur_m', 'Hauteur (m)'], ['rayon_m', 'Rayon (m)'], ['diametre_anneau_m', 'Ø de l\'anneau (m)'],['couverture_m', 'Couverture (m)'], ['talus_deg', 'Talus (°)']];

// Un élément rigide voyage tel quel : Ø de son empreinte (ou du cylindre couché) et longueur dans la coiffe
function transport(e) {
  if (e.arrivee?.mode !== 'rigide' || !e.forme) return;
  const f = e.forme, en = enveloppe(f);
  e.arrivee.dimensions_vol_m = f.type === 'cylindre' && f.axe !== 'vertical'
    ? [val(f.diametre_m), val(f.longueur_m)] : [+(2 * Math.max(en.x, en.y)).toFixed(2), +en.h.toFixed(2)];
}

function panneau() {
  const e = E[sel], P = document.getElementById('panneau'); P.innerHTML = '';
  const carte = (titre, html) => { const c = document.createElement('div'); c.className = 'carte'; c.innerHTML = `<h2>${titre}</h2>${html}`; P.appendChild(c); return c; };

  {
    const tr = transitionDe(e, CX), z = zoneDe(e, CX);
    const opt = [...Object.entries(CX.zones).filter(([k]) => k !== 'exterieur').map(([k, v]) => [`z:${k}`, `Zone · ${v.nom}`]),
                 ...Object.entries(CX.transitions).map(([k, v]) => [`t:${k}`, `Transition · ${v.nom}`])];
    const cur = tr ? `t:${tr}` : z ? `z:${z}` : '';
    const cc = carte(`${e.id} · ${e.nom || ''}`, `<div class="note">${e.type}${e.forme ? ' · ' + e.forme.type : ''}${e.dans ? ' · dans ' + e.dans : ''}${e.pressurise ? ' · pressurisé' : ''}${e.socle ? ' · sur socle' : ''}</div>
      ${e.pressurise || tr ? `<div class="ligne"><span>Rôle</span><select id="role">${cur ? '' : '<option selected value="">—</option>'}${opt.map(([k, n]) => `<option value="${k}" ${k === cur ? 'selected' : ''}>${n}</option>`).join('')}</select></div>
      ${tr ? `<div class="note">${CX.transitions[tr]?.pourquoi || ''}. ${CX.transitions[tr]?.reference || ''}</div>` : ''}` : ''}`);
    const r = cc.querySelector('#role');
    if (r) r.onchange = () => {
      const [k, v] = r.value.split(':');
      if (k === 't') { e.transition = v; delete e.zone; } else { e.zone = v; e.transition = null; }
      tout();
    };
  }

  // Forme : choisie dans le catalogue (formes.js)
  if (e.forme && (CATALOGUE[e.forme.type] || e.forme.type === 'sphere')) {
    const C = CATALOGUE[e.forme.type];
    const c = carte('Forme', `<div class="ligne"><span>Gabarit</span><select id="type">${Object.entries(CATALOGUE).map(([k, x]) => `<option value="${k}" ${k === e.forme.type ? 'selected' : ''}>${x.nom}</option>`).join('')}</select></div>
      ${e.forme.type === 'cylindre' ? `<div class="ligne"><span>Axe</span><select id="axe"><option value="horizontal" ${e.forme.axe !== 'vertical' ? 'selected' : ''}>couché</option><option value="vertical" ${e.forme.axe === 'vertical' ? 'selected' : ''}>debout</option></select></div>` : ''}
      <div class="note">${C?.note || ''}</div>`);
    c.querySelector('#type').onchange = ev => {
      const ports = e.ports;
      e.forme = changerType(e.forme, ev.target.value);
      delete e.niveaux;
      transport(e); e.ports = ports; tout();
    };
    const axe = c.querySelector('#axe');
    if (axe) axe.onchange = () => { e.forme.axe = axe.value; delete e.niveaux; tout(); };
  }

  // Dimensions modifiables
  if (e.forme) {
    const ch = CHAMPS.filter(([k]) => e.forme[k] != null);
    if (ch.length) {
      const c = carte('Dimensions', ch.map(([k, n]) => `<div class="ligne"><span>${n}</span><span><input type="number" step="0.1" min="0" data-k="${k}" value="${val(e.forme[k])}"> <span class="st">${stat(e.forme[k])}</span></span></div>`).join('')
        + `<div class="note">Une valeur modifiée ici devient ▨ (hypothèse). Rien n'est enregistré tant que tu ne télécharges pas la fiche.</div>`);
      c.querySelectorAll('input').forEach(inp => inp.addEventListener('change', () => {
        const v = parseFloat(inp.value); if (!(v > 0)) return;
        const k = inp.dataset.k, ancien = e.forme[k];
        e.forme[k] = { v, s: '▨', src: 'modifié dans l\'atelier' + (ancien && typeof ancien === 'object' && ancien.src ? ` (avant : ${val(ancien)}, ${ancien.src})` : '') };
        transport(e);
        tout();
      }));
    }
  }

  // Niveaux : planchers, surfaces, hauteur sous plafond
  const NV = niveaux(e);
  if (NV.length) {
    const deb = val(HYP.hauteur_debout_m);
    const tot = NV.reduce((a, n) => a + n.aire, 0), totD = NV.reduce((a, n) => a + n.aire_debout, 0);
    const c = carte('Niveaux', `
      <div class="ligne"><span>Plancher total</span><span class="gros">${fmt(tot, 0)} m²</span></div>
      <div class="ligne"><span>Où l'on tient debout (≥ ${deb} m <span class="st">${HYP.hauteur_debout_m.s}</span>)</span><span class="gros">${fmt(totD, 0)} m²</span></div>
      ${[...NV].reverse().map(n => `<div class="niv">
        <b>${n.id}</b>
        <input type="number" step="0.1" min="0" data-z="${n.id}" value="${+n.z.toFixed(2)}" title="hauteur du plancher (m)">
        <input class="fn" data-f="${n.id}" value="${n.fonction || ''}" placeholder="fonction">
        ${n.implicite ? '<span></span>' : `<button data-x="${n.id}" title="enlever ce niveau">×</button>`}
        <span class="chiffres">${fmt(n.aire, 0)} m² · debout ${fmt(n.aire_debout, 0)} m² · <span class="${n.hauteur_libre >= deb ? '' : 'non'}">${fmt(n.hauteur_libre, 1)} m sous plafond</span></span>
      </div>`).join('')}
      <div style="margin-top:6px"><button class="ajout" id="plus">+ niveau</button></div>
      <div class="note">z = hauteur du plancher depuis le bas de la forme. Plancher ${val(HYP.epaisseur_plancher_m)} m ${HYP.epaisseur_plancher_m.s}. En rouge : pas assez haut pour se tenir debout.</div>`);
    const explicite = () => { if (!e.niveaux) e.niveaux = NV.map(n => ({ id: n.id, z_m: { v: n.z, s: '▨' }, ...(n.fonction ? { fonction: n.fonction } : {}) })); };
    c.querySelectorAll('input[data-z]').forEach(i => i.onchange = () => {
      explicite(); const n = e.niveaux.find(x => x.id === i.dataset.z); const v = parseFloat(i.value);
      if (n && v >= 0) { n.z_m = { v, s: '▨' }; tout(); }
    });
    c.querySelectorAll('input[data-f]').forEach(i => i.onchange = () => {
      explicite(); const n = e.niveaux.find(x => x.id === i.dataset.f); if (n) { n.fonction = i.value.trim() || undefined; tout(); }
    });
    c.querySelectorAll('button[data-x]').forEach(b => b.onclick = () => {
      explicite(); e.niveaux = e.niveaux.filter(x => x.id !== b.dataset.x); if (!e.niveaux.length) delete e.niveaux; tout();
    });
    c.querySelector('#plus').onclick = () => {
      explicite();
      const haut = NV[NV.length - 1], z = +(haut.z + deb + val(HYP.epaisseur_plancher_m) + 0.4).toFixed(1);
      if (z + deb > enveloppe(e.forme).h) { c.querySelector('#plus').textContent = 'plus de place au-dessus : agrandis la forme'; return; }
      let k = e.niveaux.length + 1; while (e.niveaux.some(x => x.id === 'N' + k)) k++;
      e.niveaux.push({ id: 'N' + k, z_m: { v: z, s: '▨' } }); tout();
    };
  }

  // Radiations et temps : µSv/h de l'espace, heures par jour, heures maximum dans le quota (règle RAD-3)
  if (e.position_m || e.dans || (F.programme.fonctions || []).some(fn => fn.element === e.id)) {
    const D = doses(), B = D.budget || {}, Zb = B.zones || [];
    const fns = (F.programme.fonctions || []).filter(fn => fn.element === e.id || E[fn.element]?.dans === e.id);
    const ici = pointEspace(D.Fa, { element: e.id }), m = ici ? D.mesure(ici) : null;
    const us = x => x == null ? '?' : (1000 * x).toFixed(1);
    const pct = Math.min(100, 100 * (B.valeur || 0) / (B.seuil || 1));
    const lignes = fns.map(fn => {
      const z = Zb.find(x => x.id === fn.id) || {}, zz = D.zones.find(x => x.id === fn.id) || {};
      const hm = z.h_max == null ? null : Math.min(24, z.h_max), h = val(fn.h_jour) || 0;
      return `<div class="niv" style="grid-template-columns:1fr 58px 22px">
        <input class="fn" data-nom="${fn.id}" value="${fn.nom || ''}" placeholder="usage">
        <input type="number" step="0.5" min="0" max="24" data-h="${fn.id}" value="${h}" title="heures par jour">
        <button data-xf="${fn.id}" title="enlever cet usage">×</button>
        <span class="chiffres" style="grid-column:1/4">
          <span style="display:block;height:8px;border-radius:3px;background:var(--surface-2);position:relative;margin:2px 0 4px">
            <i style="position:absolute;left:0;top:0;bottom:0;width:${100 * h / 24}%;border-radius:3px;background:${zz.abri_eruption ? '#2f8a3c' : '#c23b12'}"></i>
            ${hm != null ? `<b style="position:absolute;top:-3px;bottom:-3px;width:2px;left:${100 * hm / 24}%;background:var(--texte)"></b>` : ''}</span>
          ${h} h × ${us(zz.mSv_h)} µSv/h = ${(h * (zz.mSv_h || 0) * 1000).toFixed(0)} µSv/j · max ${hm == null ? '?' : hm >= 24 ? '24' : hm.toFixed(1)} h
          ${zz.abri_eruption ? '<span class="ok">· 🛡 abri</span>' : '<span class="non">· pas un abri</span>'}
          <label style="margin-left:6px"><input type="checkbox" data-ar="${fn.id}" ${fn.abri_requis ? 'checked' : ''} style="width:auto"> doit être un abri</label>
          ${fn.abri_requis && !zz.abri_eruption ? '<span class="non"> ✗</span>' : ''}</span></div>`;
    }).join('');
    const c = carte('Radiations et temps', `
      ${m ? `<div class="ligne"><span>Dose ici (rayons cosmiques)</span><span class="gros">${us(m.mSv_h)} µSv/h</span></div>
      <div class="ligne"><span>Point le plus faible</span><span class="${m.abri ? 'ok' : 'non'}">${m.min == null ? '—' : Math.round(m.min) + ' g/cm²'} ${m.abri ? '🛡 abri éruption' : '· pas un abri éruption'}</span></div>` : ''}
      ${lignes || '<div class="note">Aucun usage ici : ajoute-en un pour compter le temps passé.</div>'}
      <div style="margin-top:6px"><button class="ajout" id="plus-usage">+ usage ici</button></div>
      <div class="ligne" style="margin-top:8px"><span>Journée de tout l'habitat</span><span class="${B.etat === 'ok' ? 'ok' : B.etat === 'non' ? 'non' : 'inc'}">${B.valeur ?? '?'} / ${B.seuil ?? '?'} mSv/j</span></div>
      <div style="height:6px;border-radius:3px;background:var(--surface-2)"><i style="display:block;height:100%;width:${pct}%;border-radius:3px;background:${pct < 100 ? '#2f8a3c' : '#c23b12'}"></i></div>
      <div class="note">${(B.detail || '').split(' ; ')[0]} · mission ${val(F.programme.duree_jours)} j. Barre = heures par jour (vert = abri), trait = heures maximum dans le quota. Courbe Matthiä 2024 ● ; rotation des modules ignorée ◇.</div>`);
    c.querySelectorAll('input[data-h]').forEach(i => i.onchange = () => {
      const fn = F.programme.fonctions.find(x => x.id === i.dataset.h), v = parseFloat(i.value);
      if (fn && v >= 0 && v <= 24) { fn.h_jour = { v, s: '▨', src: 'modifié dans l\'atelier' }; tout(); }
    });
    c.querySelectorAll('input[data-nom]').forEach(i => i.onchange = () => {
      const fn = F.programme.fonctions.find(x => x.id === i.dataset.nom); if (fn) { fn.nom = i.value.trim() || fn.nom; tout(); }
    });
    c.querySelectorAll('input[data-ar]').forEach(i => i.onchange = () => {
      const fn = F.programme.fonctions.find(x => x.id === i.dataset.ar); if (fn) { if (i.checked) fn.abri_requis = true; else delete fn.abri_requis; tout(); }
    });
    c.querySelectorAll('button[data-xf]').forEach(b => b.onclick = () => {
      F.programme.fonctions = F.programme.fonctions.filter(x => x.id !== b.dataset.xf); tout();
    });
    c.querySelector('#plus-usage').onclick = () => {
      F.programme.fonctions = F.programme.fonctions || [];
      let k = 1; while (F.programme.fonctions.some(x => x.id === `${e.id.toLowerCase()}-${k}`)) k++;
      F.programme.fonctions.push({ id: `${e.id.toLowerCase()}-${k}`, nom: 'Nouvel usage', element: e.id, h_jour: { v: 1, s: '▨', src: 'ajouté dans l\'atelier' } });
      tout();
    };
  }

  // Volume, masse, lanceur
  const vol = volumeForme(e.forme);
  const masse = val(e.masse_kg);
  const veh = e.arrivee?.vehicule ? R.vehicules?.[e.arrivee.vehicule] : null;
  let gab = '';
  if (e.arrivee?.mode === 'in_situ') gab = `<div class="ligne"><span>Arrivée</span><span>fabriqué sur place</span></div>`;
  else if (e.arrivee) {
    const dv = val(e.arrivee.dimensions_vol_m?.[0]);
    const du = val(veh?.diametre_utile_m), mp = val(veh?.masse_posee_kg);
    const etat = (a, b) => a == null || b == null ? `<span class="inc">?</span>` : a <= b ? `<span class="ok">✓</span>` : `<span class="non">✗</span>`;
    gab = `<div class="ligne"><span>Arrivée</span><span>${e.arrivee.mode}${e.arrivee.lot ? ' · ' + e.arrivee.lot : ''}</span></div>
      <div class="ligne"><span>Véhicule</span><span>${veh?.nom || e.arrivee.vehicule || '?'}</span></div>
      <div class="ligne"><span>Ø plié ${fmt(dv)} m / coiffe ${fmt(du)} m <span class="st">${stat(veh?.diametre_utile_m) || ''}</span></span>${etat(dv, du)}</div>
      <div class="ligne"><span>Masse ${fmt(masse, 0)} kg / posée ${fmt(mp, 0)} kg <span class="st">${stat(veh?.masse_posee_kg) || ''}</span></span>${etat(masse, mp)}</div>`;
  }
  carte('Ce qu\'il pèse, ce qu\'il prend', `
    <div class="ligne"><span>Volume de l'enveloppe</span><span class="gros">${vol == null ? '—' : fmt(vol, 0) + ' m³'}</span></div>
    <div class="ligne"><span>Masse</span><span class="gros ${masse == null ? 'inc' : ''}">${masse == null ? '? à estimer' : fmt(masse, 0) + ' kg'}</span></div>
    ${gab}`);

  // Ports
  const qs = A.ports[e.id] || [];
  const pose = A.poses[e.id];
  const ICO = { ok: '<span class="ok">✓</span>', non: '<span class="non">✗</span>', doute: '<span class="inc">?</span>' };
  if (qs.length) {
    const optPorte = cur => Object.entries(CX.portes).map(([k, p]) => `<option value="${k}" ${k === cur ? 'selected' : ''}>${p.nom}</option>`).join('') + (cur ? '' : '<option value="" selected>(ancien port : Ø seul)</option>');
    const optNiv = cur => `<option value="" ${!cur ? 'selected' : ''}>hauteur écrite</option>` + NV.map(n => `<option value="${n.id}" ${n.id === cur ? 'selected' : ''}>${n.id}${n.fonction ? ' · ' + n.fonction : ''}</option>`).join('');
    const c = carte('Portes et ports', qs.map(q => {
      const qf = e.ports.find(p => p.id === q.id) || {};
      const P = porteDe(qf, CX);
      const l = A.liens.find(l => (l.de === e.id && l.port_de === q.id) || (l.vers === e.id && l.port_vers === q.id));
      const voisin = q.relie_a?.split('.')[0];
      const res = X.portes.find(x => x.element === e.id && x.port === q.id)?.msgs || [];
      const lat = !String(qf.face || '').includes('z');
      return `<div class="port"><span class="pt ${q.relie_a ? '' : 'libre'}"></span>
        <span><b>${q.id}</b> ${q.nom || ''}<br><span class="note">face ${qf.face || '—'} · ${fmt(P.largeur)} × ${fmt(P.hauteur)} m · ${P.etanche ? 'étanche' : 'non étanche'}</span></span>
        ${voisin ? `<button data-v="${voisin}">→ ${q.relie_a}</button>` : `<span class="note">${P.exterieure ? 'dehors' : 'libre'}</span>`}
        <span></span><span style="display:flex;gap:4px;flex-wrap:wrap"><select data-porte="${q.id}" aria-label="Type de porte">${optPorte(qf.porte)}</select>${lat && NV.length ? `<select data-niv="${q.id}" aria-label="Niveau de la porte">${optNiv(qf.niveau)}</select>` : ''}</span><span></span>
        ${l && l.ecart ? `<span></span><span class="note">tunnel / couloir ${fmt(l.ecart)} m${l.brut?.circulation ? ' · ' + l.brut.circulation : ''}</span><span></span>` : ''}
        <span></span><span>${res.map(m => `<div class="msg">${ICO[m.etat]} ${m.texte} <b>${m.regle}</b></div>`).join('')}</span><span></span></div>`;
    }).join('') + `<details style="margin-top:6px"><summary class="note">Ce que doit faire chaque porte étanche (NASA-STD-3001 Vol. 2)</summary><div class="note">${CX.regles.exigences_porte_etanche}</div></details>`);
    c.querySelectorAll('button[data-v]').forEach(b => b.onclick = () => choisir(b.dataset.v));
    c.querySelectorAll('select[data-porte]').forEach(s => s.onchange = () => {
      const qf = e.ports.find(p => p.id === s.dataset.porte); qf.porte = s.value || undefined;
      if (s.value) { delete qf.diametre_m; delete qf.type; }
      tout();
    });
    c.querySelectorAll('select[data-niv]').forEach(s => s.onchange = () => {
      const qf = e.ports.find(p => p.id === s.dataset.niv); if (s.value) { qf.niveau = s.value; delete qf.hauteur_m; } else delete qf.niveau;
      tout();
    });
  } else if (!e.dans) carte('Ports d\'amarrage', `<div class="note">Aucun port : cet élément n'est pas placé par l'assemblage${e.forme?.type === 'butte' ? ' (la butte se calcule autour des modules)' : ''}.</div>`);

  // Connexions : liaisons de cet élément, règles de l'élément, parcours depuis dehors
  {
    const mine = X.liens.filter(l => [l.de, l.vers].some(s => String(s).split('.')[0] === e.id));
    const propres = X.elements[e.id]?.msgs || [];
    const ch = X.parcours[e.id];
    if (mine.length || propres.length || ch) carte('Connexions', `
      ${ch ? `<div class="chemin">${ch.join(' → ')}</div>` : ''}
      ${propres.map(m => `<div class="msg">${ICO[m.etat]} ${m.texte} <b>${m.regle}</b></div>`).join('')}
      ${mine.map(l => `<div style="border-top:1px solid var(--filet);padding-top:4px;margin-top:4px"><div class="note"><b>${l.de} → ${l.vers}</b> · ${CX.liaisons[l.type]?.nom || l.type}</div>
        ${l.msgs.map(m => `<div class="msg">${ICO[m.etat]} ${m.texte} <b>${m.regle}</b></div>`).join('')}</div>`).join('')}`);
  }

  // Contenu
  const dedans = F.elements.filter(x => x.dans === e.id);
  if (dedans.length) {
    const c = carte('Contient', dedans.map(x => `<div class="ligne"><span>${x.id} · ${x.nom || x.type}</span><button class="lien" data-v="${x.id}">ouvrir</button></div>`).join(''));
    c.querySelectorAll('button[data-v]').forEach(b => b.onclick = () => choisir(b.dataset.v));
  }

  // Position
  if (pose) {
    const bon = !pose.assemble || pose.ancre || ((pose.ecart_m ?? 0) <= 0.01 && (pose.ecart_rot ?? 0) <= 0.5);
    carte('Place dans l\'ensemble', `
      <div class="ligne"><span>${pose.ancre ? 'Ancre : garde sa position' : pose.assemble ? 'Placé par les ports' : 'Placé à la main'}</span><span class="${bon ? 'ok' : 'non'}">${bon ? '✓' : '✗'}</span></div>
      <div class="ligne"><span>Position</span><span class="st">[${pose.pos.map(x => fmt(x)).join(', ')}] m · ${fmt(pose.rot, 0)}°</span></div>
      ${!bon ? `<div class="note">Écrit en [${pose.ecrit.pos.join(', ')}] : les ports le déplacent de ${fmt(pose.ecart_m, 2)} m.</div>` : ''}`);
  }

  // Ensemble
  const msgs = [...A.erreurs.map(x => `<div class="ligne non">✗ ${x}</div>`), ...A.avertissements.map(x => `<div class="ligne inc">! ${x}</div>`)];
  const c = carte('Ensemble', (msgs.join('') || `<div class="ligne ok">✓ tous les ports reliés se font face</div>`)
    + `<div class="ligne"><span>Connexions</span><span><span class="ok">${X.resume.ok} ✓</span> · <span class="non">${X.resume.non} ✗</span> · <span class="inc">${X.resume.doute} ?</span></span></div>`
    + `<div class="actions" style="margin-top:6px"><button id="dl">Télécharger la fiche</button><a href="controle.html?fiche=${encodeURIComponent(ficheNom)}">Contrôler l'ensemble</a></div>`
    + `<div class="note">La fiche téléchargée contient les dimensions modifiées et les positions données par les ports. Pour la garder, remplace ${ficheNom}.</div>`);
  c.querySelector('#dl').onclick = telecharger;
}

function telecharger() {
  const G = structuredClone(F);
  for (const e of G.elements) {
    const p = A.poses[e.id];
    if (p?.assemble) { e.position_m = p.pos.map(x => +x.toFixed(3)); if (p.rot) e.rotation_deg = +p.rot.toFixed(3); else delete e.rotation_deg; }
  }
  const url = URL.createObjectURL(new Blob([JSON.stringify(G, null, 1) + '\n'], { type: 'application/json' }));
  const a = document.createElement('a'); a.href = url; a.download = ficheNom; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function tout() { A = assembler(F, CX); X = analyser(F, CX, A); liste(); panneau(); construire(); }
function choisir(id) {
  sel = id;
  const u = new URL(location.href); u.searchParams.set('el', id); history.replaceState(null, '', u);
  tout();
}
const MODES = [['m-seul', 'seul'], ['m-tout', 'tout'], ['m-parcours', 'parcours']];
for (const [b, m] of MODES) document.getElementById(b).onclick = () => {
  mode = m; for (const [bb, mm] of MODES) document.getElementById(bb).classList.toggle('on', m === mm); construire();
};
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { scene.background = fondCouleur(); });

taille(); tout(); boucle();
window.KIBSU_ATELIER = { F, get A() { return A; }, get X() { return X; }, choisir };
</script>
</body>
</html>
