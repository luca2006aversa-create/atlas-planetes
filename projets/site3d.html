<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kibsu · site en 3D</title>
<link href="../tokens.css" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #f2ede4; font: 13px/1.4 var(--sans); overflow: hidden; }
  #vue { position: fixed; inset: 0; }
  .barre { position: fixed; left: 12px; right: 12px; bottom: 12px; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center;
           background: rgba(10,10,10,.78); border: 1px solid #333; border-radius: 10px; padding: 10px 12px; }
  .barre button { font: 600 12.5px var(--sans); background: #222; color: #f2ede4; border: 1px solid #444; border-radius: 6px; padding: 6px 10px; cursor: pointer; }
  .barre button.on { background: #f2ede4; color: #141414; }
  .barre input[type=range] { flex: 1 1 220px; accent-color: #e4572e; }
  .date { font: 13px var(--mono); min-width: 150px; }
  .titre { position: fixed; left: 12px; top: 90px; background: rgba(10,10,10,.7); border-radius: 8px; padding: 8px 12px; max-width: 520px; }
  .titre b { font-size: 15px; } .titre span { color: #a8a8a8; display: block; font-size: 12px; }
  .etq { position: fixed; transform: translate(-50%, -130%); font: 600 12px var(--sans); white-space: nowrap; pointer-events: none;
         text-shadow: 0 0 4px #000, 0 0 2px #000; }
  .etq small { font-weight: 400; color: #bbb; }
  .titre nav { margin-top: 6px; font-size: 12px; } .titre nav a { color: #f2b29c; margin-right: 10px; }
  body.embed .titre { display: none; }
  body.embed .barre { left: 8px; right: 8px; bottom: 8px; }
  .boussole { position: fixed; right: 12px; top: 90px; width: 120px; height: 120px; }
</style>
<script src="../nav.js" defer data-fixe data-ton="sombre"></script>
</head>
<body>
<div id="vue"></div>
<div class="titre"><b>Habitat de crête · pôle sud lunaire</b>
  <span id="info">Relief LOLA 20 m (4 km) et 120 m (160 km), courbure de la Lune comprise. 5 044 étoiles (magnitude ≤ 6). Glisser pour tourner, molette pour zoomer.</span></div>
<svg class="boussole" id="boussole" viewBox="-60 -60 120 120"></svg>
<div id="etiquettes"></div>
<div class="barre">
  <button id="v-air" class="on">Vue d'ensemble</button>
  <button id="v-crete">À hauteur d'homme</button>
  <button id="v-coupe">Coupe de la butte</button>
  <button id="variante">Fenêtre : directe</button>
  <button id="lire">▶ Le temps passe</button>
  <input type="range" id="temps" min="0" max="708" step="1" value="0" aria-label="Date (un mois lunaire, pas d'une heure)">
  <span class="date" id="date"></span>
</div>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { astres, depaqueter, jourJ2000, iauLune, repereLocal, azHaut, etoile } from './ciel.js';

const RAD = Math.PI / 180;
const PARAMS = new URLSearchParams(location.search), EMBED = PARAMS.get('embed') === '1';
let MEM = null; try { MEM = !EMBED && JSON.parse(sessionStorage.getItem('kibsu-fiche')); } catch (e) { /* pas de mémoire : la fiche du dossier */ }
const fiche = PARAMS.get('fiche') || MEM?.nom || 'pole-sud-esquisse.json';   // l'onglet Fichier transmet sa fiche (curseurs compris)
if (EMBED) document.body.classList.add('embed');
if (EMBED) addEventListener('keydown', e => { if (e.key === 'Escape') parent.postMessage('kibsu-echap', location.origin); });   // Échap : quitter le grand écran de l'onglet Projets
const [META, F, PLAN, HAB, PLA] = await Promise.all(['site/relief.json', fiche, '../etude/donnees/plan.json',
  '../etude/donnees/habitat.json', '../donnees/planetes.json'].map(u => fetch(u).then(r => r.json())));
const [BP, BL] = await Promise.all([META.proche.fichier, META.loin.fichier].map(f => fetch('site/' + f).then(r => r.arrayBuffer())));
const PLANETES = depaqueter(PLA);
const ETOILES = await fetch('site/etoiles.json').then(r => r.json()).then(j => j.etoiles).catch(() => []);
const RL = META.rayon_lune_m, [cx, cy] = META.centre_xy_m;

// repère : x = droite de la carte (90° E), y = haut, z = − haut de la carte (vers la longitude 0 = la Terre en moyenne)
const P3 = (mx, my, h) => new THREE.Vector3(mx, h, -my);
const dirAz = (az, h) => new THREE.Vector3(Math.sin(az * RAD) * Math.cos(h * RAD), Math.sin(h * RAD), -Math.cos(az * RAD) * Math.cos(h * RAD));

const rendu = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
rendu.setPixelRatio(Math.min(2, devicePixelRatio));
rendu.shadowMap.enabled = true;
rendu.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('vue').appendChild(rendu.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color('#000');
const camera = new THREE.PerspectiveCamera(50, 1, 0.3, 600000);
const ctl = new OrbitControls(camera, rendu.domElement);
ctl.enableDamping = true;

// --- relief ---
function terrain(buf, m, abaisser) {
  const q = new Int16Array(buf), n = m.n, pas = m.pas_m, demi = m.demi_m;
  const g = new THREE.PlaneGeometry(2 * demi, 2 * demi, n - 1, n - 1);
  const pos = g.attributes.position;
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
    const k = i * n + j, x = -demi + j * pas, y = demi - i * pas;
    let h = q[k] * META.unite_m - (x * x + y * y) / (2 * RL);           // courbure : la Lune s'arrondit
    if (abaisser && Math.abs(x) < demi * 0 + 1950 && Math.abs(y) < 1950) h -= 40; // sous le relief fin
    pos.setXYZ(k, x, h, -y);
  }
  g.computeVertexNormals();
  return g;
}
const sol = new THREE.MeshStandardMaterial({ color: '#8d8a84', roughness: 1, metalness: 0 });
const loin = new THREE.Mesh(terrain(BL, META.loin, true), sol);
const proche = new THREE.Mesh(terrain(BP, META.proche, false), sol);
loin.receiveShadow = proche.receiveShadow = true; proche.castShadow = true;
scene.add(loin, proche);

// --- habitat, d'après la fiche ---
const val = x => (x && typeof x === 'object' && 'v' in x) ? x.v : x;
const ax = HAB.terrain.crete_az;                                         // azimut de l'axe x du projet (crête)
const ux = [Math.sin(ax * RAD), Math.cos(ax * RAD)], uy = [Math.sin((ax - 90) * RAD), Math.cos((ax - 90) * RAD)];
const projet = new THREE.Group();
projet.matrixAutoUpdate = false;
projet.matrix.set(ux[0], 0, uy[0], 0,  0, 1, 0, 0,  -ux[1], 0, -uy[1], 0,  0, 0, 0, 1);  // (u, h, v) → (x, h, −y)
scene.add(projet);
const L3 = (u, v, h) => new THREE.Vector3(u, h, v);

const matButte = new THREE.MeshStandardMaterial({ color: '#b9b3a6', roughness: 1, side: THREE.DoubleSide, transparent: true, opacity: 1 });
const matMod = new THREE.MeshStandardMaterial({ color: '#f2ede4', roughness: .6, side: THREE.DoubleSide }), matSas = new THREE.MeshStandardMaterial({ color: '#e4572e', roughness: .6, side: THREE.DoubleSide });
const matAir = new THREE.MeshBasicMaterial({ color: '#e4572e', transparent: true, opacity: .45, side: THREE.DoubleSide, depthWrite: false });
// habitat d'après la fiche ; refait à chaque fiche reçue de l'onglet Projets (curseurs)
let c = 0, H = 0;
function batir(F) {
  for (const o of [...projet.children]) { projet.remove(o); o.geometry?.dispose(); }
  const habs = F.elements.filter(e => e.pressurise && e.forme?.type === 'cylindre');
  const B = F.elements.find(e => e.forme?.type === 'butte');
  const Rm = Math.max(...habs.map(e => val(e.forme.diametre_m) / 2)), couv = val(B.forme.couverture_m), tal = val(B.forme.talus_deg);
  const xa = Math.min(...habs.map(e => e.position_m[0] - val(e.forme.longueur_m) / 2)), xb = Math.max(...habs.map(e => e.position_m[0] + val(e.forme.longueur_m) / 2));
  c = Rm + couv; H = 2 * Rm + couv; const pied = c + H / Math.tan(tal * RAD);
  function stade(dist, z, N = 40) {
    const pts = [];
    for (let k = 0; k <= N; k++) { const a = -Math.PI / 2 + Math.PI * k / N; pts.push(L3(xb + dist * Math.cos(a), dist * Math.sin(a), z)); }
    for (let k = 0; k <= N; k++) { const a = Math.PI / 2 + Math.PI * k / N; pts.push(L3(xa + dist * Math.cos(a), dist * Math.sin(a), z)); }
    return pts;
  }
  const bas = stade(pied, -1), haut = stade(c, H), nn = bas.length, pb = [];
  for (let i = 0; i < nn; i++) { const j = (i + 1) % nn; pb.push(bas[i], bas[j], haut[j], bas[i], haut[j], haut[i]); }
  for (let i = 1; i < nn - 1; i++) pb.push(haut[0], haut[i], haut[i + 1]);
  const gb = new THREE.BufferGeometry().setFromPoints(pb); gb.computeVertexNormals();
  const butte = new THREE.Mesh(gb, matButte); butte.castShadow = butte.receiveShadow = true;
  projet.add(butte);

  for (const e of F.elements.filter(e => e.forme?.type === 'cylindre')) {
    const R = val(e.forme.diametre_m) / 2, Lg = val(e.forme.longueur_m);
    const m = new THREE.Mesh(new THREE.CylinderGeometry(R, R, Lg, 48), e.pressurise ? matMod : matSas);
    m.rotation.z = Math.PI / 2; m.position.copy(L3(e.position_m[0], e.position_m[1], R)); m.castShadow = true;
    projet.add(m);
  }
  for (const e of F.elements.filter(e => e.type === 'ouverture' && e.forme?.type === 'boite')) {   // puits, chambres
    const b = new THREE.Mesh(new THREE.BoxGeometry(e.forme.dim_m[0], e.forme.dim_m[2], e.forme.dim_m[1]), matAir);
    b.position.copy(L3(...e.forme.centre_m)); projet.add(b);
  }
  for (const Fe of F.elements.filter(e => e.type === 'ouverture' && e.forme?.type === 'fente').map(e => e.forme)) {   // fentes
    const o = Fe.oeil_m, w = Fe.largeur_oeil_m / 2, hh = Fe.hauteur_oeil_m / 2, D = 30;
    const ta = Fe.az_deg.map(a => Math.tan(a * RAD)), te = Fe.el_deg.map(a => Math.tan(a * RAD));
    const q = (dy, su, se) => L3(o[0] + (su ? w + dy * ta[1] : -w + dy * ta[0]), o[1] + dy, o[2] + (se ? hh + dy * te[1] : -hh + dy * te[0]));
    const v = [q(0,0,0), q(0,1,0), q(0,1,1), q(0,0,1), q(D,0,0), q(D,1,0), q(D,1,1), q(D,0,1)];
    const f = [[0,1,2,3],[4,5,6,7],[0,1,5,4],[1,2,6,5],[2,3,7,6],[3,0,4,7]].flatMap(([a,b,c2,d]) => [v[a],v[b],v[c2],v[a],v[c2],v[d]]);
    projet.add(new THREE.Mesh(new THREE.BufferGeometry().setFromPoints(f), matAir));
  }
  // chapeaux de régolithe (renforts posés sur la butte)
  for (const e of F.elements.filter(e => e.forme?.type === 'chapeau')) {
    const r = val(e.forme.rayon_m), h = val(e.forme.hauteur_m);
    const k = new THREE.Mesh(new THREE.ConeGeometry(r, h, 40, 1, true), matButte);
    k.position.copy(L3(e.forme.centre_m[0], e.forme.centre_m[1], H + h / 2)); k.castShadow = k.receiveShadow = true;
    projet.add(k);
  }
}
batir(MEM && MEM.nom === fiche && MEM.F ? MEM.F : F);
if (EMBED) addEventListener('message', e => { if (e.origin === location.origin && e.data?.type === 'kibsu-fiche') batir(e.data.F); });

// mâts solaires et aire d'atterrissage du plan de l'étude
const matMat = new THREE.MeshStandardMaterial({ color: '#f2c14e', roughness: .5 });
for (const m of PLAN.mats) {
  const x = m.xy[0] * 1000 - cx, y = m.xy[1] * 1000 - cy;
  const k = Math.round((2000 - y) / 20) * META.proche.n + Math.round((x + 2000) / 20);
  const z = (new Int16Array(BP)[k] ?? 0) * META.unite_m - (x * x + y * y) / (2 * RL);
  const mat = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.6, 20, 12), matMat);
  mat.position.copy(P3(x, y, z + 10)); mat.castShadow = true; scene.add(mat);
}

// --- ciel : Soleil, Terre, planètes, écliptique ---
const LAT = HAB.lat, LON = HAB.lon, DCIEL = 200000;
const soleil = new THREE.DirectionalLight('#ffffff', 3.2);
soleil.castShadow = true;
soleil.shadow.mapSize.set(4096, 4096);
Object.assign(soleil.shadow.camera, { left: -400, right: 400, top: 400, bottom: -400, near: 10, far: 6000 });
soleil.shadow.bias = -0.0004;
scene.add(soleil, soleil.target, new THREE.AmbientLight('#404a5a', 0.25));
const terreLum = new THREE.DirectionalLight('#9fc0e8', 0.05); scene.add(terreLum);   // clair de Terre, très faible

const disque = (deg, couleur) => new THREE.Mesh(new THREE.SphereGeometry(DCIEL * Math.tan(deg / 2 * RAD), 32, 16), new THREE.MeshBasicMaterial({ color: couleur }));
const mSoleil = disque(0.53, '#fff6d5'), mTerre = disque(1.9, '#cfe3f2');
scene.add(mSoleil, mTerre);
const COUL = { mercure: '#a39a8f', venus: '#e3c58f', mars: '#d98f6c', jupiter: '#d9b48f', saturne: '#e3cf9b', uranus: '#c9cfcc', neptune: '#8d8d8d', pluton: '#cbb8a4', ceres: '#b0a79a', vesta: '#b0a79a' };
const NOMS = { soleil: 'Soleil', terre: 'Terre', mercure: 'Mercure', venus: 'Vénus', mars: 'Mars', jupiter: 'Jupiter', saturne: 'Saturne', uranus: 'Uranus', neptune: 'Neptune', pluton: 'Pluton', ceres: 'Cérès', vesta: 'Vesta' };
const mPla = {};
for (const k of Object.keys(PLANETES)) if (k !== 'terre') {
  mPla[k] = new THREE.Mesh(new THREE.SphereGeometry(DCIEL * 0.0022, 12, 8), new THREE.MeshBasicMaterial({ color: COUL[k] || '#aaa' }));
  scene.add(mPla[k]);
}
// étoiles (catalogue d3-celestial, magnitude ≤ 6) : trois groupes de taille selon l'éclat, couleur selon l'indice B-V
function couleurBV(bv) { const t = Math.max(0, Math.min(1, (bv + 0.3) / 2)); return new THREE.Color().setHSL(0.62 - 0.55 * t, 0.35 + 0.3 * Math.abs(t - 0.35), 0.82); }
const groupes = [[-2, 1.5, 3.8], [1.5, 3.5, 2.5], [3.5, 6.1, 1.5]].map(([m0, m1, taille]) => {
  const liste = ETOILES.filter(e => e[2] >= m0 && e[2] < m1);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(liste.length * 3), 3));
  const col = new Float32Array(liste.length * 3);
  liste.forEach((e, i) => { const k = Math.max(0.5, Math.min(1, 1.25 - e[2] / 7)); const cc = couleurBV(e[3]); col.set([cc.r * k, cc.g * k, cc.b * k], 3 * i); });
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const p = new THREE.Points(g, new THREE.PointsMaterial({ size: taille, sizeAttenuation: false, vertexColors: true, depthWrite: false }));
  scene.add(p);
  return { liste, g };
});
function placerEtoiles(d) {
  const M = iauLune(d), L = repereLocal(LAT, LON), v = new THREE.Vector3();
  for (const { liste, g } of groupes) {
    const pos = g.attributes.position;
    liste.forEach((e, i) => { const a = etoile(e[0], e[1], d, LAT, LON, M, L); v.copy(dirAz(a.az, a.h)).multiplyScalar(DCIEL * 1.2); pos.setXYZ(i, v.x, v.y, v.z); });
    pos.needsUpdate = true; g.computeBoundingSphere();
  }
}
const geoEcl = new THREE.BufferGeometry(), ecl = new THREE.Line(geoEcl, new THREE.LineDashedMaterial({ color: '#6b6b6b', dashSize: 3000, gapSize: 3000 }));
scene.add(ecl);

const et = document.getElementById('etiquettes'), etq = {};
for (const k of ['soleil', 'terre', ...Object.keys(mPla)]) {
  etq[k] = document.createElement('div'); etq[k].className = 'etq'; et.appendChild(etq[k]);
}

const d0 = Math.floor(jourJ2000(new Date())) ;
let dCour = d0, AST = null;
function placerCiel(d) {
  AST = astres(d, LAT, LON, PLANETES);
  const s = dirAz(AST.soleil.az, AST.soleil.h);
  mSoleil.position.copy(s.clone().multiplyScalar(DCIEL));
  soleil.position.copy(s.clone().multiplyScalar(3000)); soleil.target.position.set(0, 0, 0);
  soleil.intensity = AST.soleil.h > -0.3 ? 3.2 : 0.0;                    // sous l'horizon : nuit (l'ombre du relief fait le reste)
  const t = dirAz(AST.terre.az, AST.terre.h);
  mTerre.position.copy(t.clone().multiplyScalar(DCIEL)); terreLum.position.copy(t);
  for (const [k, m] of Object.entries(mPla)) m.position.copy(dirAz(AST[k].az, AST[k].h).multiplyScalar(DCIEL * 0.98));
  // écliptique : longitudes 0-360° → directions locales
  const M = iauLune(d), L = repereLocal(LAT, LON), OBL = 23.4392911 * RAD, pts = [];
  for (let l = 0; l <= 360; l += 2) {
    const v = [Math.cos(l * RAD), Math.sin(l * RAD) * Math.cos(OBL), Math.sin(l * RAD) * Math.sin(OBL)];
    const w = M.map(r => r[0] * v[0] + r[1] * v[1] + r[2] * v[2]), a = azHaut(w, L);
    pts.push(dirAz(a.az, a.h).multiplyScalar(DCIEL * 0.99));
  }
  geoEcl.setFromPoints(pts); ecl.computeLineDistances();
  placerEtoiles(d);
  const dt = new Date(Date.UTC(2000, 0, 1, 12) + d * 86400000);
  document.getElementById('date').textContent = dt.toISOString().slice(0, 16).replace('T', ' ') + ' UTC';
  boussole();
}

function boussole() {
  const b = document.getElementById('boussole');
  const az = Math.atan2(camera.getWorldDirection(new THREE.Vector3()).x, -camera.getWorldDirection(new THREE.Vector3()).z) / RAD;
  const pt = (a, r) => [r * Math.sin((a - az) * RAD), -r * Math.cos((a - az) * RAD)];
  const mk = (k, coul, r = 5) => { const [x, y] = pt(AST[k].az, 44); return `<circle cx="${x}" cy="${y}" r="${r}" fill="${coul}"/>`; };
  b.innerHTML = `<circle r="54" fill="rgba(10,10,10,.7)" stroke="#444"/><line y1="-54" y2="-40" stroke="#f2ede4" stroke-width="2"/>
    ${mk('soleil', '#fff6d5', 6)}${mk('terre', '#7fb6d9', 6)}
    ${Object.keys(mPla).map(k => mk(k, COUL[k] || '#aaa', 2.5)).join('')}
    <text y="4" text-anchor="middle" font-size="10" fill="#a8a8a8">vue</text>`;
}

function etiquettes() {
  const w = innerWidth, h = innerHeight, v = new THREE.Vector3();
  const pos = { soleil: mSoleil.position, terre: mTerre.position, ...Object.fromEntries(Object.entries(mPla).map(([k, m]) => [k, m.position])) };
  for (const [k, p] of Object.entries(pos)) {
    v.copy(p).project(camera);
    const vis = v.z < 1 && Math.abs(v.x) < 1.1 && Math.abs(v.y) < 1.1;
    const e = etq[k];
    if (!vis) { e.style.display = 'none'; continue; }
    e.style.display = '';
    e.style.left = ((v.x + 1) / 2 * w) + 'px'; e.style.top = ((1 - v.y) / 2 * h) + 'px';
    const a = AST[k];
    e.style.color = k === 'terre' ? '#9fc8e8' : k === 'soleil' ? '#fff3c4' : (COUL[k] || '#ccc');
    const cache = a.h < HAB.horizon.h[Math.round(a.az) % 360];                // derrière le relief lointain
    e.style.opacity = cache ? 0.55 : 1;
    e.innerHTML = `${NOMS[k]} <small>${a.h >= 0 ? '+' : ''}${a.h.toFixed(1)}°${cache ? ' · sous l\'horizon' : ''}</small>`;
  }
}

// --- vues ---
const vues = {
  air: () => { camera.position.set(-260, 180, 330); ctl.target.set(0, 0, 0); },
  crete: () => {                                                          // 1,7 m au-dessus du sommet de la butte, regard vers la Terre
    camera.position.set(0, H + 1.7, 0); const t = dirAz(AST.terre.az, AST.terre.h); ctl.target.copy(t.multiplyScalar(50).add(camera.position)); },
  coupe: null,
};
function choisir(id) {
  document.querySelectorAll('.barre button[id^=v-]').forEach(b => b.classList.toggle('on', b.id === 'v-' + id));
  matButte.opacity = id === 'coupe' ? 0.25 : 1; matButte.depthWrite = id !== 'coupe';
  if (id === 'coupe') { camera.position.set(-90, 45, 70); ctl.target.set(0, 4, 0); } else vues[id]();
  ctl.update();
}
['air', 'crete', 'coupe'].forEach(id => document.getElementById('v-' + id).onclick = () => choisir(id));

const protegee = fiche.includes('protegee');
const bv = document.getElementById('variante');
bv.textContent = protegee ? 'Fenêtre : périscope ⇄' : 'Fenêtre : directe ⇄';
bv.onclick = () => { PARAMS.set('fiche', protegee ? 'pole-sud-esquisse.json' : 'pole-sud-fenetre-protegee.json'); location.search = '?' + PARAMS; };
if (EMBED) bv.style.display = 'none';            // intégré : la fiche se choisit dans le panneau de l'onglet Projets
const curs = document.getElementById('temps');
curs.oninput = () => { dCour = d0 + curs.value / 24; placerCiel(dCour); };
let lecture = false;
document.getElementById('lire').onclick = e => { lecture = !lecture; e.target.textContent = lecture ? '❚❚ Pause' : '▶ Le temps passe'; };

function taille() { rendu.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', taille); taille();
